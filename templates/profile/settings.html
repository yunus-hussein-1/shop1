{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1 class="page-title">{{ t('settings') }}</h1>
  <div class="two-col" style="align-items:start">
    <div class="form-card" style="margin:0">
      <h1 style="font-size:1.15rem">تغيير كلمة السر</h1>
      <form method="post">
        <input type="hidden" name="action" value="change_password">
        <div class="field"><label>كلمة السر الحالية</label><input type="password" name="old_password" required></div>
        <div class="field"><label>كلمة السر الجديدة</label><input type="password" name="new_password" required minlength="8"></div>
        <div class="field"><label>تأكيد كلمة السر</label><input type="password" name="confirm" required minlength="8"></div>
        <button type="submit" class="btn btn-primary btn-block">تحديث كلمة السر</button>
      </form>
    </div>

    <div class="form-card" style="margin:0; border-color:#f2c6c1">
      <h1 style="font-size:1.15rem; color:var(--danger)">حذف الحساب نهائياً</h1>
      <p class="sub">هاد الإجراء لا يمكن التراجع عنه. رح يتم حذف كل بياناتك.</p>
      <form method="post">
        <input type="hidden" name="action" value="delete_account">
        <div class="field"><label>أدخل كلمة السر للتأكيد</label><input type="password" name="confirm_password" required></div>
        <button type="submit" class="btn btn-danger btn-block">حذف الحساب نهائياً</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
