{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1 class="page-title">❤️ المفضلة</h1>
  {% if items %}
  <div class="grid-products" style="margin-top:20px">
    {% for f in items %}
      {% set p = f.product %}
      {% include "partials/product_card.html" %}
    {% endfor %}
  </div>
  {% else %}
  <div class="empty-state">
    <p>لسا ما ضفت أي منتج للمفضلة. دوس على 🤍 بأي منتج عشان تضيفه هون.</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary" style="margin-top:14px">تسوّق هلق</a>
  </div>
  {% endif %}
</div>
{% endblock %}
