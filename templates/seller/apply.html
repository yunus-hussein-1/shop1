{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="form-card wide">
    <h1>{{ t('sell_on_shayeb') }}</h1>
    <p class="sub">افتح متجرك الخاص على شايب ووصّل منتجاتك لآلاف الزبائن. عمولة المنصة 10% فقط من كل عملية بيع.</p>
    <form method="post" enctype="multipart/form-data">
      <div class="two-col">
        <div class="field"><label>اسم المتجر</label><input type="text" name="name" required></div>
        <div class="field">
          <label>قسم المتجر</label>
          <select name="category">
            <option value="clothing">ألبسة</option>
            <option value="electronics">إلكترونيات</option>
          </select>
        </div>
      </div>
      <div class="field"><label>شعار/صورة المتجر</label><input type="file" name="logo" accept="image/*"></div>
      <div class="field"><label>نبذة عن المتجر</label><textarea name="description" rows="3"></textarea></div>
      <div class="field"><label>رقم شام كاش لاستلام مستحقاتك</label><input type="tel" name="shamcash_number" required></div>
      <div class="checkbox-row" style="margin-bottom:18px">
        <input type="checkbox" name="agree_terms" id="agree2" required>
        <label for="agree2">موافق على <a href="{{ url_for('pages.seller_agreement') }}" target="_blank">اتفاقية البائع</a> وعمولة 10% على المبيعات.</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">إرسال طلب البيع</button>
    </form>
  </div>
</div>
{% endblock %}
