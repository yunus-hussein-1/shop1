{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h1>تعيين كلمة سر جديدة</h1>
    <p class="sub">دخّل الكود يلي وصلك عالإيميل مع كلمة السر الجديدة.</p>
    <form method="post">
      <div class="field">
        <label>الكود (6 أرقام)</label>
        <input type="text" name="code" maxlength="6" required autofocus>
      </div>
      <div class="field">
        <label>كلمة السر الجديدة</label>
        <input type="password" name="new_password" required minlength="8">
      </div>
      <div class="field">
        <label>تأكيد كلمة السر</label>
        <input type="password" name="confirm" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block">تعيين كلمة السر</button>
    </form>
  </div>
</div>
{% endblock %}
