{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h1>{{ 'تعيين كلمة سر جديدة' if current_lang=='ar' else 'Set a new password' }}</h1>
    <p class="sub">{{ 'دخّل الكود يلي وصلك عالإيميل مع كلمة السر الجديدة.' if current_lang=='ar' else 'Enter the code sent to your email along with your new password.' }}</p>
    <form method="post">
      <div class="field">
        <label>{{ 'الكود (6 أرقام)' if current_lang=='ar' else 'Code (6 digits)' }}</label>
        <input type="text" name="code" maxlength="6" required autofocus>
      </div>
      <div class="field">
        <label>{{ 'كلمة السر الجديدة' if current_lang=='ar' else 'New password' }}</label>
        <input type="password" name="new_password" required minlength="8">
      </div>
      <div class="field">
        <label>{{ t('confirm_password') }}</label>
        <input type="password" name="confirm" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block">{{ 'تعيين كلمة السر' if current_lang=='ar' else 'Set password' }}</button>
    </form>
  </div>
</div>
{% endblock %}
