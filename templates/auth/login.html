{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h1>{{ t('login') }}</h1>
    <p class="sub">أهلاً فيك من جديد بعيلة شايب 🌿</p>
    <form method="post">
      <div class="field">
        <label>الإيميل</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>كلمة السر</label>
        <input type="password" name="password" required>
      </div>
      <div class="checkbox-row" style="margin-bottom:16px; justify-content:space-between">
        <label><input type="checkbox" name="remember"> تذكرني</label>
        <a href="{{ url_for('auth.forgot_password') }}">نسيت كلمة السر؟</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">{{ t('login') }}</button>
    </form>
    <div style="display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-500); font-size:.8rem">
      <hr style="flex:1; border:none; border-top:1px solid var(--line)"> أو <hr style="flex:1; border:none; border-top:1px solid var(--line)">
    </div>
    <a href="{{ url_for('auth.login_google') }}" class="btn btn-ghost btn-block">تسجيل الدخول عبر جوجل</a>
    <p class="form-foot">ما عندك حساب؟ <a href="{{ url_for('auth.register') }}" style="color:var(--green-700); font-weight:700">سجّل هلق</a></p>
  </div>
</div>
{% endblock %}
