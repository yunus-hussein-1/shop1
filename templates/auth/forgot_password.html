{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="form-card">
    <h1>نسيت كلمة السر؟</h1>
    <p class="sub">دخّل إيميلك وبنبعتلك كود تفعيل لتعيين كلمة سر جديدة.</p>
    <form method="post">
      <div class="field">
        <label>الإيميل</label>
        <input type="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">إرسال الكود</button>
    </form>
    <p class="form-foot"><a href="{{ url_for('auth.login') }}" style="color:var(--green-700); font-weight:700">رجوع لتسجيل الدخول</a></p>
  </div>
</div>
{% endblock %}
